<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PulseDesk</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: white;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(90deg, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            color: transparent;
        }

        .container {
            width: 420px;
            margin: auto;
        }

        .glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }

        input {
            width: 95%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: #0f172a;
            color: white;
        }

        .channels button {
            margin: 5px;
            padding: 8px 14px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            cursor: pointer;
        }

        .channels button.active {
            background: #6366f1;
        }

        .submit-btn {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #38bdf8, #6366f1);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.05);
        }

        .ticket {
            background: rgba(255,255,255,0.05);
            margin-top: 10px;
            padding: 15px;
            border-radius: 15px;
            transition: 0.3s;
        }

        .ticket:hover {
            transform: translateY(-5px);
        }

        .high { color: red; }
        .medium { color: orange; }
        .low { color: lightgreen; }

        .badge {
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #6366f1;
            padding: 12px 18px;
            border-radius: 10px;
            display: none;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .counter {
            font-size: 14px;
            opacity: 0.8;
        }

        canvas {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>🚀 PulseDesk</h1>

<div class="container">

    <div class="glass">
        <input id="text" placeholder="Describe your issue..." />

        <div class="channels">
            <button onclick="setChannel('web')" class="active">🌐</button>
            <button onclick="setChannel('email')">📧</button>
            <button onclick="setChannel('slack')">💬</button>
        </div>

        <button class="submit-btn" onclick="submitComment()">Submit</button>
    </div>

    <div class="glass">

        <div class="stats">
            <div class="counter" id="count"></div>
        </div>

        <canvas id="chart"></canvas>

        <button class="submit-btn" onclick="loadTickets()">Load Tickets</button>

        <div id="tickets"></div>

    </div>

</div>

<div class="toast" id="toast">Ticket created 🚀</div>

<script>
    const API = "http://localhost:8080/api";
    let selectedChannel = "web";
    let chart;

    function setChannel(c) {
        selectedChannel = c;
        document.querySelectorAll(".channels button").forEach(b => b.classList.remove("active"));
        event.target.classList.add("active");
    }

    async function submitComment() {
        const text = document.getElementById("text").value;

        if (!text) {
            document.getElementById("text").style.border = "2px solid red";
            return;
        }

        await fetch(API + "/comments", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ text, channel: selectedChannel })
        });

        showToast();
        loadTickets();
    }

    async function loadTickets() {
        const res = await fetch(API + "/tickets");
        const data = await res.json();

        let html = "";

        let high = 0, medium = 0, low = 0;

        data.forEach(t => {
            if (t.priority === "high") high++;
            if (t.priority === "medium") medium++;
            if (t.priority === "low") low++;

            html += `
        <div class="ticket">
            <b>${t.title}</b><br>
            ${t.description}<br>
            ${getCategoryIcon(t.category)} ${t.category}<br>
            <span class="${t.priority}">${t.priority}</span>
        </div>`;
        });

        document.getElementById("tickets").innerHTML = html;
        document.getElementById("count").innerText =
            data.length + " tickets • " + high + " high";

        renderChart(high, medium, low);
    }

    function renderChart(h, m, l) {
        const ctx = document.getElementById("chart");

        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['High', 'Medium', 'Low'],
                datasets: [{
                    data: [h, m, l]
                }]
            },
            options: {
                plugins: {
                    legend: { labels: { color: 'white' } }
                }
            }
        });
    }

    function getCategoryIcon(cat) {
        if (cat === "bug") return "🐛";
        if (cat === "feature") return "💡";
        if (cat === "billing") return "💳";
        return "❓";
    }

    function showToast() {
        const t = document.getElementById("toast");
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 2000);
    }
</script>

</body>
</html>
